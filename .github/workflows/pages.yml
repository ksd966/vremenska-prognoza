# Objavljuje sadržaj repozitorijuma na GitHub Pages.
# Korak `configure-pages` sa `enablement: true` ume i da uključi Pages ako nije uključen,
# pa nije potrebno ništa podešavati ručno.
name: Objavi na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  objavi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: objava
        uses: actions/deploy-pages@v4
